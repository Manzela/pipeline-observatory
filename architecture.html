<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Architecture — moved to Pipeline · Daniel Manzela</title>
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://manzela.github.io/pipeline-observatory/">
<!--
  This file is a redirect proxy. The content that used to live here has been
  merged into / (the Pipeline lifecycle page). The 5 historical anchor IDs
  (#dag-h, #moe-h, #orav-h, #flow-h, #tenants-h) are mapped to the
  corresponding anchors on the merged page (#dag, #moe, #orav, #flywheel,
  #multi-tenant) by the inline script below. Visitors with JavaScript
  disabled fall through to the meta-refresh target (the merged page root
  with #dag fallback). The page returns HTTP 200 (not 404) so search
  engines treat it as a 301-equivalent redirect.

  See docs/superpowers/specs/2026-05-18-merge-architecture-observability-design.md
  §3 (URL strategy) and §7.3 (Components — redirect proxy).
-->
<script>
(function () {
  // Run before meta-refresh so JS-enabled visitors land on the right anchor
  // instead of the meta-refresh fallback. Map the original fragment to the
  // merged-page anchor; default to #dag for the bare URL and any unknown
  // fragment (the page anchor most aligned with "the architecture explainer").
  var REDIRECTS = {
    '':             '#dag',
    '#dag-h':       '#dag',
    '#moe-h':       '#moe',
    '#orav-h':      '#orav',
    '#flow-h':      '#flywheel',
    '#tenants-h':   '#multi-tenant'
  };
  var target = REDIRECTS[location.hash] || '#dag';
  // Compute base prefix: works both locally (/architecture.html -> /) and on
  // GitHub Pages (/pipeline-observatory/architecture.html -> /pipeline-observatory/).
  var base = location.pathname.replace(/architecture\.html$/, '');
  // location.replace so the deprecated URL doesn't pollute back-button history.
  location.replace(base + target);
})();
</script>
<meta http-equiv="refresh" content="0; url=/#dag">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  }
  @media (prefers-color-scheme: dark) {

      --ink-rule: rgba(232, 230, 224, 0.12); --prob-blue: #6FA0CC;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: var(--paper); color: var(--ink);
    font: 400 15px/1.5 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  main { max-width: 520px; text-align: center; }
  p { margin: 0 0 16px; }
  .label {
    color: var(--ink-low); font-size: 12px;
    letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 24px;
  }
  a {
    color: var(--prob-blue); text-decoration: none;
    border-bottom: 1px solid var(--ink-rule); padding-bottom: 1px;
  }
  a:hover, a:focus-visible { border-color: var(--prob-blue); }
  a:focus-visible { outline: 2px solid var(--prob-blue); outline-offset: 2px; }
</style>
